<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in &middot; {{ app_name }}</title>
  <style>
    @font-face{font-family:"Rajdhani";font-weight:600;font-style:normal;font-display:swap;
      src:url("{{ url_for('static', filename='fonts/rajdhani-600-latin.woff2') }}") format("woff2");
      unicode-range:U+0000-00FF,U+2000-206F;}
    @font-face{font-family:"Rajdhani";font-weight:700;font-style:normal;font-display:swap;
      src:url("{{ url_for('static', filename='fonts/rajdhani-700-latin.woff2') }}") format("woff2");
      unicode-range:U+0000-00FF,U+2000-206F;}
    :root{
      --bg:#0b0f17; --card:#111725; --card-line:#1e2637; --field:#0d1320;
      --ink:#e7ecf3; --muted:#8b96a7;
      --brand:#288000; --brand-hover:#1f6600;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--ink);position:relative;background:var(--bg);
      font:14px/1.5 "Segoe UI",Calibri,Arial,sans-serif;
      display:flex;align-items:center;justify-content:center;padding:24px}
    /* wallpaper on its own layer (separate from the dim overlay below) so its
       brightness can be tuned independently of the overlay's text-contrast job */
    body::before{content:"";position:fixed;inset:0;z-index:-2;
      background:url("{{ url_for('static', filename='login-bg.jpg') }}") center/cover no-repeat fixed}
    body::after{content:"";position:fixed;inset:0;z-index:-1;
      background:linear-gradient(rgba(11,15,23,.55),rgba(11,15,23,.7))}
    .card{width:100%;max-width:360px;background:rgba(17,23,37,.6);
      -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
      border:1px solid var(--card-line);border-radius:14px;padding:32px 30px;
      box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .mark{width:40px;height:40px;border-radius:50%;background:var(--brand);
      display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
    .mark svg{width:20px;height:20px;fill:#fff}
    h1{font-size:18px;margin:0;font-weight:700;font-family:"Rajdhani","Segoe UI",sans-serif;
      text-align:center}
    .sub{color:var(--muted);font-size:12.5px;margin:4px 0 26px;text-align:center}
    label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
    .field{position:relative}
    .field-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);
      width:16px;height:16px;fill:var(--muted);pointer-events:none}
    input{width:100%;background:var(--field);border:1px solid var(--card-line);
      border-radius:8px;padding:11px 12px 11px 38px;color:var(--ink);font:inherit}
    input:focus{outline:none;border-color:var(--brand)}
    input:focus~.field-ic{fill:var(--brand)}
    #password{padding-right:38px}
    .eye-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);
      width:auto;margin-top:0;background:none;border:0;padding:8px;cursor:pointer;color:var(--muted);
      display:flex;align-items:center;justify-content:center}
    .eye-toggle:hover{color:var(--ink)}
    .eye-toggle svg{width:16px;height:16px}
    .eye-toggle path{fill:currentColor}
    .eye-toggle .slash{stroke:currentColor;stroke-width:2;stroke-linecap:round}
    .eye-toggle.show .slash{display:none}
    button{width:100%;margin-top:22px;background:var(--brand);color:#fff;border:0;
      border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;
      font-family:"Rajdhani","Segoe UI",sans-serif}
    button:hover{background:var(--brand-hover)}
    .flash{background:#3b1d1d;border:1px solid #6b2b2b;color:#f6c9c9;
      border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px}
    .foot{margin-top:20px;text-align:center;font-size:11.5px;color:var(--muted)}
  </style>
</head>
<body>
  <form class="card" method="post">
    <span class="mark"><svg viewBox="0 0 24 24"><path d="M4 20h16v-2H4v2zM6 16h3V7H6v9zm5 0h3V4h-3v12zm5 0h3v-6h-3v6z"/></svg></span>
    <h1>{{ app_name }}</h1>
    <p class="sub">Sign in to continue</p>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}

    <label for="username">Username</label>
    <div class="field">
      <input id="username" name="username" autocomplete="username" autofocus required>
      <svg class="field-ic" viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14z"/></svg>
    </div>

    <label for="password">Password</label>
    <div class="field">
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <svg class="field-ic" viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zM9 9V6a3 3 0 1 1 6 0v3H9zm3 4a2 2 0 0 1 1 3.73V19a1 1 0 1 1-2 0v-2.27A2 2 0 0 1 12 13z"/></svg>
      <button type="button" class="eye-toggle" id="pwToggle" aria-label="Show password">
        <svg viewBox="0 0 24 24">
          <path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
          <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
        </svg>
      </button>
    </div>

    <button type="submit">Sign in</button>

    <p class="foot">Owner and staff both sign in here.</p>
  </form>
  <script>
    document.getElementById("pwToggle").addEventListener("click", function () {
      var pw = document.getElementById("password");
      var willShow = pw.type === "password";
      pw.type = willShow ? "text" : "password";
      this.classList.toggle("show", willShow);
      this.setAttribute("aria-label", willShow ? "Hide password" : "Show password");
    });
  </script>
</body>
</html>
