name: Keep forecasting service warm

# Render's free tier spins the forecasting service down after ~15 minutes
# idle, and the next request pays a 30-50s cold boot - by far the biggest
# part of a slow "Run comparison" (the five-model fit itself is ~0.6s).
# Pinging it keeps the instance up so nobody waits on a boot.
#
# This hits the forecast service's /health directly rather than going
# through the Next.js /api/cron/warm-forecast route. /health is
# unauthenticated by design (forecast-service/main.py), so this needs no
# secret and no repository variable to work - one less thing to misconfigure,
# and it doesn't spend a Vercel function invocation per ping. The warm route
# still exists and is still used by /forecasting on mount.
#
# Budget note: Render free allows 750 instance-hours a month and keeping one
# service always-on uses ~730, so this consumes nearly all of it. Disable
# this workflow when you don't need the service responsive (Actions ->
# this workflow -> Disable workflow) and a month costs almost nothing.

on:
  schedule:
    # Every 5 minutes, not every 10, because GitHub queues scheduled runs on
    # a best-effort basis and routinely delays them under load. At */5 a run
    # can slip ~10 minutes and still land inside Render's 15-minute idle
    # window; at */10 the same slip misses it and the service sleeps.
    - cron: "*/5 * * * *"
  workflow_dispatch: # so it can be triggered by hand to check the wiring

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the forecasting service
        env:
          # Override with a repository variable only if the service moves.
          HEALTH_URL: ${{ vars.FORECAST_HEALTH_URL || 'https://j1spa-dss.onrender.com/health' }}
        run: |
          echo "Pinging $HEALTH_URL"
          # --max-time 90 leaves room for a genuine cold boot (30-50s) plus
          # headroom, so a real wake-up is reported as success, not a timeout.
          body=$(curl -sS --max-time 90 \
            -w '\nHTTP %{http_code} in %{time_total}s\n' \
            "$HEALTH_URL") || {
              echo "::error::Could not reach the forecasting service."
              exit 1
            }
          echo "$body"
          case "$body" in
            *'"ok":true'*) echo "Forecasting service is up." ;;
            *) echo "::error::Service answered but did not report healthy."; exit 1 ;;
          esac
